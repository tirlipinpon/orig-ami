<div class="reset-password-container">
  <div class="reset-password-box">
    <h2>Réinitialiser le mot de passe</h2>
    
    @if (!isValidToken) {
      <!-- Message d'erreur si le lien est invalide -->
      <div class="error-message">
        {{ errorMessage }}
      </div>
      
      <button class="btn-secondary" (click)="goToLogin()">
        ← Retour à la connexion
      </button>
    } @else {
      <!-- Formulaire de réinitialisation -->
      <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe *</label>
          <input 
            type="password" 
            id="newPassword" 
            name="newPassword" 
            [(ngModel)]="newPassword" 
            required 
            minlength="6"
            placeholder="Minimum 6 caractères"
            class="form-control"
            [disabled]="isLoading">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le mot de passe *</label>
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            [(ngModel)]="confirmPassword" 
            required 
            minlength="6"
            placeholder="Retapez le mot de passe"
            class="form-control"
            [disabled]="isLoading">
        </div>

        @if (errorMessage) {
          <div class="error-message">
            {{ errorMessage }}
          </div>
        }
        
        @if (successMessage) {
          <div class="success-message">
            {{ successMessage }}
          </div>
        }

        <button 
          type="submit" 
          class="btn-submit" 
          [disabled]="!resetForm.form.valid || isLoading">
          @if (isLoading) {
            <span>Modification en cours...</span>
          } @else {
            <span>Modifier le mot de passe</span>
          }
        </button>
      </form>
      
      <div class="back-to-login-link">
        <a href="#" (click)="goToLogin(); $event.preventDefault()">← Retour à la connexion</a>
      </div>
    }
  </div>
</div>
